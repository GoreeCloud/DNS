server:
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: "unbound"
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    verbosity: 1
    log-queries: no
    # Isolated Compose backend only; do not publish this port externally.
    access-control: 0.0.0.0/0 allow
