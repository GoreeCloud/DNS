name: Porkbun CLI offline tests

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'tools/porkbun/**'
      - '.github/workflows/porkbun-cli.yml'
  pull_request:
    paths:
      - 'tools/porkbun/**'
      - '.github/workflows/porkbun-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Offline Porkbun API client security tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile client and test source
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in (Path('tools/porkbun/gc-porkbun'), Path('tools/porkbun/test_gc_porkbun.py')):
              compile(file.read_text(), str(file), 'exec')
          PY
      - name: Run offline unit tests
        run: python -m unittest discover -s tools/porkbun -p 'test_gc_porkbun.py' -v
