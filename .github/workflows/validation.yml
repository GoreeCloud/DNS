name: Source baseline validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go unit and package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go package tests
        run: go test ./...

  frontend-v2:
    name: Modern frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: client_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client_v2/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build-prod
