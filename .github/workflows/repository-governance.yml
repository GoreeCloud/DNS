name: Repository Governance

on:
  push:
    branches:
      - main
      - 'foundation/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOREECLOUD_DNS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate repository governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOREECLOUD_DNS_SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOREECLOUD_DNS_SOURCE_REVISION"
      - name: Validate DNS repository governance
        run: python3 scripts/validate_repository_governance.py
