name: GoreeCloud DNS static verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test brand, license, accessibility and packaging
        run: python3 -m unittest discover -s tests -p 'test_goreecloud_frontend.py' -v
      - name: Check browser script syntax
        run: |
          node --check DnsServerCore/www/js/main.js
          node --check DnsServerCore/dohwww/js/main.js
      - name: Check committed patch whitespace
        run: git show --format= --check HEAD
