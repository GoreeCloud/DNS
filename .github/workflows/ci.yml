name: DNS foundation CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: Go resolver, tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Resolve exact module dependency graph
        run: go mod tidy
      - name: Test resolver
        run: go test -race ./...
      - name: Static vet
        run: go vet ./...
      - name: Build daemon
        run: go build -o /tmp/goreecloud-dns ./cmd/dnsd
  web:
    name: React web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
  android:
    name: Android Compose debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Compose client
        run: gradle :app:assembleDebug --no-daemon
