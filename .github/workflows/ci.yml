name: DNS foundation CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: Go resolver, tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Verify dependency graph and checksums
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Test resolver
        run: go test -race ./...
      - name: Static vet
        run: go vet ./...
      - name: Build daemon
        run: go build -o /tmp/goreecloud-dns ./cmd/dnsd
  web:
    name: React web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
  android:
    name: Android Compose debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile Compose client
        run: gradle :app:assembleDebug --no-daemon

  compose:
    name: Loopback container DNS smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot a synthetic loopback-only DNS stack
        env:
          DNS_API_TOKEN: synthetic-ci-token-not-for-deployment
        run: |
          set -euo pipefail
          printf 'blocked.example\n' > config/rules.txt
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent -H "Authorization: Bearer $DNS_API_TOKEN" http://127.0.0.1:8080/api/v1/status \
            | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['rules'] == 1"
      - name: Verify DNS wire policy over UDP on localhost
        run: |
          python3 - <<'PY'
          import socket
          import struct
          name = b"\x07blocked\x07example\x00"
          query = struct.pack("!HHHHHH", 0xC13A, 0x0100, 1, 0, 0, 0) + name + struct.pack("!HH", 1, 1)
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as conn:
              conn.settimeout(3)
              conn.sendto(query, ("127.0.0.1", 1053))
              response, _ = conn.recvfrom(4096)
          assert response[:2] == query[:2]
          assert response[3] & 15 == 3, "expected NXDOMAIN for blocked.example"
          print("Synthetic loopback-only NXDOMAIN behavior verified")
          PY
      - name: Remove local test stack
        if: always()
        env:
          DNS_API_TOKEN: synthetic-ci-token-not-for-deployment
        run: docker compose down --volumes --remove-orphans
