name: DNS foundation CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: Go resolver, tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Verify dependency graph and checksums
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf 'Go source needs gofmt:\\n%s\\n' "$unformatted"
            exit 1
          fi
      - name: Test resolver
        run: go test -race ./...
      - name: Bounded DNS wire and policy fuzz regression
        run: |
          set -euo pipefail
          go test ./internal/server -run '^$' -fuzz '^FuzzDNSWirePrivacy$' -fuzztime=100x -parallel=2
          go test ./internal/server -run '^$' -fuzz '^FuzzUpstreamResponseIdentity$' -fuzztime=100x -parallel=2
          go test ./internal/policy -run '^$' -fuzz '^FuzzPolicyFileParser$' -fuzztime=100x -parallel=2
          go test ./internal/records -run '^$' -fuzz '^FuzzLocalRecordFileParser$' -fuzztime=100x -parallel=2
      - name: Static vet
        run: go vet ./...
      - name: Build development daemon with provenance
        run: |
          mkdir -p build/ci
          CGO_ENABLED=0 go build -trimpath -o build/ci/goreecloud-dns-linux-amd64 ./cmd/dnsd
          cd build/ci
          sha256sum goreecloud-dns-linux-amd64 > SHA256SUMS
          go version -m goreecloud-dns-linux-amd64 > build-info.txt
          printf 'Development-only binary; not signed, released or deployed. Source: %s\n' "$GITHUB_SHA" > README.txt
      - name: Retain development Go binary
        uses: actions/upload-artifact@v4
        with:
          name: dns-go-resolver-dev
          path: build/ci/
          retention-days: 7
          if-no-files-found: error
  web:
    name: React web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Record web build provenance
        run: |
          cd dist
          sha256sum index.html > SHA256SUMS
          printf 'Development-only web bundle; requires an independently protected HTTPS API. Source: %s\n' "$GITHUB_SHA" > README.txt
      - name: Retain development web build
        uses: actions/upload-artifact@v4
        with:
          name: dns-react-web-dev
          path: web/dist/
          retention-days: 7
          if-no-files-found: error
  android:
    name: Android Compose debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Run strict Android endpoint unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compile Compose client
        run: gradle :app:assembleDebug --no-daemon
      - name: Record debug APK provenance
        run: |
          mkdir -p build/ci
          cp app/build/outputs/apk/debug/app-debug.apk build/ci/goreecloud-dns-debug.apk
          cd build/ci
          sha256sum goreecloud-dns-debug.apk > SHA256SUMS
          printf 'Debug-signed APK for authorized temporary testing only. Source: %s\n' "$GITHUB_SHA" > README.txt
      - name: Retain Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-android-debug-dev
          path: android/build/ci/
          retention-days: 7
          if-no-files-found: error

  compose:
    name: Loopback container DNS smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot a synthetic loopback-only DNS stack
        env:
          DNS_API_TOKEN: synthetic-ci-token-not-for-deployment
        run: |
          set -euo pipefail
          printf 'blocked.example\n' > config/rules.txt
          printf 'A home.example 192.0.2.42\nAAAA home.example 2001:db8::42\nCNAME alias.example home.example\n' > config/local-records.txt
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent -H "Authorization: Bearer $DNS_API_TOKEN" http://127.0.0.1:8080/api/v1/status \
            | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['rules'] == 1"
      - name: Verify synthetic loopback UDP TCP and local DNS records
        env:
          DNS_API_TOKEN: synthetic-ci-token-not-for-deployment
        run: python3 scripts/loopback_smoke.py
      - name: Remove local test stack
        if: always()
        env:
          DNS_API_TOKEN: synthetic-ci-token-not-for-deployment
        run: docker compose down --volumes --remove-orphans

  linux:
    name: Native Qt Quick Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system graphics development requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libopengl-dev libegl-dev libxkbcommon-dev
      - name: Install audited installer tool into isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt-venv"
          "$RUNNER_TEMP/aqt-venv/bin/pip" install --no-cache-dir "aqtinstall==3.3.0"
      - name: Install exact open-source Qt 6.12.0 build dependencies
        run: |
          "$RUNNER_TEMP/aqt-venv/bin/aqt" install-qt linux desktop 6.12.0 linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"
      - name: Build native Linux application
        run: |
          cmake -S linux -B "$RUNNER_TEMP/gc-dns-qt-build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.12.0/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/gc-dns-qt-build" --parallel 2
      - name: Verify strict native Linux endpoint policy
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          bin="$RUNNER_TEMP/gc-dns-qt-build/goreecloud-dns-linux"
          "$bin" --validate-endpoint "https://dns.example.org"
          "$bin" --validate-endpoint "http://127.0.0.1:8080"
          "$bin" --validate-endpoint "http://localhost:8080"
          "$bin" --validate-endpoint "http://[::1]:8080"
          if "$bin" --validate-endpoint "http://127.0.0.1:8080@attacker.example"; then exit 1; fi
          if "$bin" --validate-endpoint "http://example.org"; then exit 1; fi
          if "$bin" --validate-endpoint "https://user:pass@dns.example.org"; then exit 1; fi
          if "$bin" --validate-endpoint "https://dns.example.org/evil?query=1"; then exit 1; fi
          if "$bin" --validate-endpoint "file:///etc/passwd"; then exit 1; fi
      - name: Check native launch without a display
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
        run: |
          set +e
          timeout 6s "$RUNNER_TEMP/gc-dns-qt-build/goreecloud-dns-linux" >"$RUNNER_TEMP/qt-launch.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/qt-launch.log"
          if [ "$result" -ne 124 ]; then
            echo "Unexpected native-client exit status $result"
            exit 1
          fi
      - name: Record dynamically linked Linux build provenance
        run: |
          mkdir -p build/ci/linux
          cp "$RUNNER_TEMP/gc-dns-qt-build/goreecloud-dns-linux" build/ci/linux/
          cd build/ci/linux
          sha256sum goreecloud-dns-linux > SHA256SUMS
          printf 'Development-only, dynamically linked Qt Quick 6.12.0 executable; Qt is not bundled. Source: %s\n' "$GITHUB_SHA" > README.txt
      - name: Retain native Linux development binary
        uses: actions/upload-artifact@v4
        with:
          name: dns-linux-qt612-dev
          path: build/ci/linux/
          retention-days: 7
          if-no-files-found: error
